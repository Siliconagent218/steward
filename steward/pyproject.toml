[project]
name = "steward"
version = "0.0.1"
description = "Steward Phase 0: world simulation, rendering, and robot Ego Runtime"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.scripts]
steward = "steward.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
