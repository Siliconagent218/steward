<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward 控制台</title>
<style>
  :root { --bg: #0f1216; --card: #171b21; --line: #2a313a; --text: #dde3ea; --muted: #8b96a3; --ego: #ff9f43; --gt: #4aa3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button, select { background: #222831; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                   padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3c4652; }
  button.on { border-color: var(--ego); color: #ffd2a6; }
  .pill { padding: 2px 8px; border-radius: 999px; background: #222831; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wrap { padding: 14px 16px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; display: flex; flex-wrap: wrap;
             gap: 8px; align-items: center; }
  .card h2 .spacer { flex: 1; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pane-title { font-size: 13px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .pane-title .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .pane-title .sub { color: var(--muted); font-size: 12px; }
  .viewport { position: relative; border-radius: 8px; overflow: hidden; background: #11151a; aspect-ratio: 4 / 3;
              cursor: grab; user-select: none; touch-action: none; }
  .viewport.dragging { cursor: grabbing; }
  .viewport img, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viewport img:not([src]) { visibility: hidden; }
  .viewport .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .hint { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: #c3ccd6aa; pointer-events: none; }
  .grid3 { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px) { .panes, .grid3 { grid-template-columns: 1fr; } }
  canvas.plain { width: 100%; display: block; border-radius: 6px; background: #11151a; }
  .cam img { width: 100%; border-radius: 6px; background: #11151a; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .cam img:not([src]) { visibility: hidden; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 3px 0; border-bottom: 1px solid #20262e; }
  td:last-child { text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .events { max-height: 140px; overflow: auto; font-size: 12px; color: var(--muted); margin: 8px 0 0; padding-left: 18px; }
  .task { color: var(--muted); }
  .err { color: #ff6b6b; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: stretch; }
  @media (max-width: 1300px) { .top { grid-template-columns: 1fr; } .chat { height: 560px; } }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat .msgs { flex: 1 1 0; min-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
                padding: 4px 2px 8px; }
  .msg { max-width: 92%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1f3a5c; }
  .msg.assistant { align-self: flex-start; background: #232a33; }
  .msg.error { align-self: stretch; background: #3a1f24; color: #ffb3b3; font-size: 12px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; padding: 2px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); max-width: 100%; }
  .tool summary { cursor: pointer; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .ok { color: #3ecf8e; } .tool .bad { color: #ff6b6b; } .tool .run { color: var(--ego); }
  .tool pre { margin: 4px 0 0; padding: 6px 8px; background: #11151a; border-radius: 6px; max-height: 180px; overflow: auto;
              white-space: pre-wrap; word-break: break-all; font-size: 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chips button { font-size: 12px; padding: 3px 8px; color: var(--muted); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; height: 58px; background: #11151a; color: var(--text); border: 1px solid var(--line);
                       border-radius: 8px; padding: 7px 9px; font: inherit; }
  .composer textarea:focus { outline: none; border-color: #3c4652; }
  .composer button { height: 58px; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Steward 控制台</h1>
  <select id="scenario" title="Scenario"></select>
  <button id="load">加载</button>
  <button id="reset">重置</button>
  <button id="pause">暂停</button>
  <select id="speed" title="仿真倍速">
    <option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option>
    <option value="4">4×</option><option value="8">8×</option>
  </select>
  <span class="pill" id="clock">t = –</span>
  <span class="task" id="task"></span>
  <span class="spacer"></span>
  <span class="err" id="error"></span>
</header>
<div class="wrap">
  <div class="top">
  <section class="card">
    <h2>
      斜视主视图（两个面板共用同一相机）
      <span class="spacer"></span>
      <button data-view="south" class="on">斜上方·南</button>
      <button data-view="southeast">斜上方·东南</button>
      <button data-view="southwest">斜上方·西南</button>
      <button data-view="top">正上方</button>
    </h2>
    <div class="panes">
      <div>
        <div class="pane-title"><span class="dot" style="background:var(--gt)"></span>World State
          <span class="sub">世界真实状态（WSim 渲染）</span></div>
        <div class="viewport" id="vpWorld">
          <img id="imgWorld" alt="World State">
          <canvas id="ovWorld" width="1024" height="768"></canvas>
          <div class="hint">拖动旋转 · 滚轮缩放</div>
        </div>
      </div>
      <div>
        <div class="pane-title"><span class="dot" style="background:var(--ego)"></span>Ego State
          <span class="sub" id="egoSub">机器人自我态（同一转换器渲染）</span></div>
        <div class="viewport" id="vpEgo">
          <img id="imgEgo" alt="Ego State">
          <canvas id="ovEgo" width="1024" height="768"></canvas>
          <div class="empty" id="egoEmpty">尚未收到机器人的自我态</div>
          <div class="hint">拖动旋转 · 滚轮缩放</div>
        </div>
      </div>
    </div>
    <div class="legend">
      <label><input type="checkbox" id="showGtLabels" checked>World：物体标签</label>
      <label><input type="checkbox" id="showEgoLabels" checked>Ego：物体标签</label>
      <label><input type="checkbox" id="showSigma" checked>Ego：2σ 不确定度</label>
      <label><input type="checkbox" id="showError" checked>Ego：到真实位置的误差线</label>
    </div>
  </section>
  <section class="card chat">
    <h2>世界编辑对话 <span class="pill" id="chatStatus">World Harness</span>
      <span class="spacer"></span><button id="chatReset" title="开始新的 World Harness 会话">新会话</button></h2>
    <div class="msgs" id="chatMsgs"></div>
    <div class="chips" id="chatChips">
      <button>把杯子挪到餐边柜上</button><button>在餐桌上再放一个碗</button>
      <button>把盘子拿走</button><button>把餐桌往东挪 30 厘米</button>
    </div>
    <div class="composer">
      <textarea id="chatInput" placeholder="描述要对世界做的修改，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="chatSend">发送</button>
    </div>
  </section>
  </div>
  <div class="grid3">
    <section class="card">
      <h2 id="robotCamLabel">机器人头部相机</h2>
      <div class="cam"><img id="camRobot" alt="机器人头部相机"></div>
    </section>
    <section class="card">
      <h2>俯视地图（蓝：真实状态　橙：自我态）</h2>
      <canvas class="plain" id="map" width="700" height="560"></canvas>
    </section>
    <section class="card">
      <h2>Observer 指标</h2>
      <table id="metrics"></table>
      <canvas class="plain" id="chart" width="700" height="150" style="margin-top:10px"></canvas>
      <h2 style="margin-top:12px">事件</h2>
      <ol class="events" id="events"></ol>
    </section>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = { table: '#c9a46b', counter: '#8a6a4a', cabinet: '#a07850', sideboard: '#b08860', cup: '#7fd3ff',
  bowl: '#e8e8ea', plate: '#f2f2f2', 'steward-bot': '#4aa3ff', wall: '#5b6570', floor: '#1c2128' };
const NAMES = { table: '餐桌', counter: '操作台', cabinet: '柜子', sideboard: '餐边柜', cup: '杯子', bowl: '碗',
  plate: '盘子', 'steward-bot': '机器人' };
const RENDER_W = 1024, RENDER_H = 768;
let state = null, robotId = null, view = null, viewKey = '';
const panes = {
  world: { img: 'imgWorld', overlay: 'ovWorld', rendered: null },
  ego: { img: 'imgEgo', overlay: 'ovEgo', rendered: null },
};

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function showError(e) { $('error').textContent = e ? String(e.message || e) : ''; }

// ------------------------------------------------------------------ camera
const rad = (d) => d * Math.PI / 180;
function presetView(name) {
  const base = state.view;
  const preset = { south: [90, -50], southeast: [135, -45], southwest: [45, -45], top: [90, -89] }[name];
  return { ...base, azimuth: preset[0], elevation: preset[1], distance: name === 'top' ? base.distance * 1.05 : base.distance };
}
function cameraFrame(cam) {
  const az = rad(cam.azimuth), el = rad(cam.elevation);
  const fwd = [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
  const up = [-Math.cos(az) * Math.sin(el), -Math.sin(az) * Math.sin(el), Math.cos(el)];
  const right = [fwd[1] * up[2] - fwd[2] * up[1], fwd[2] * up[0] - fwd[0] * up[2], fwd[0] * up[1] - fwd[1] * up[0]];
  const pos = cam.lookat.map((v, i) => v - cam.distance * fwd[i]);
  return { fwd, up, right, pos, f: (RENDER_H / 2) / Math.tan(rad(cam.fovy) / 2) };
}
function project(frame, p) {
  const d = [p[0] - frame.pos[0], p[1] - frame.pos[1], p[2] - frame.pos[2]];
  const z = d[0] * frame.fwd[0] + d[1] * frame.fwd[1] + d[2] * frame.fwd[2];
  if (z < 0.05) return null;
  const x = d[0] * frame.right[0] + d[1] * frame.right[1] + d[2] * frame.right[2];
  const y = d[0] * frame.up[0] + d[1] * frame.up[1] + d[2] * frame.up[2];
  return [RENDER_W / 2 + frame.f * x / z, RENDER_H / 2 - frame.f * y / z];
}
function painter(ctx, frame) {
  return {
    line(a, b) { const pa = project(frame, a), pb = project(frame, b);
      if (pa && pb) { ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke(); } },
    text(p, s, color) { const q = project(frame, p); if (!q) return;
      ctx.font = '600 20px -apple-system, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = '#0b0e12cc'; ctx.strokeText(s, q[0], q[1]);
      ctx.fillStyle = color; ctx.fillText(s, q[0], q[1]); },
  };
}
const label = (category, id) => `${NAMES[category] || category}${id ? ' ' + id.replace('w:', '') : ''}`;

// ----------------------------------------------------------------- overlays
function drawWorldOverlay() {
  const cv = $('ovWorld'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const cam = panes.world.rendered;
  if (!state || !state.loaded || !cam || !$('showGtLabels').checked) return;
  const p = painter(ctx, cameraFrame(cam));
  for (const g of state.groundTruth) {
    if (g.role === 'environment') continue;
    p.text([g.center[0], g.center[1], g.center[2] + g.size[2] / 2 + 0.1], label(g.category, g.id), '#cfe6ff');
  }
}
function drawEgoOverlay() {
  const cv = $('ovEgo'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const cam = panes.ego.rendered;
  const robot = state && state.loaded && robotId && state.robots[robotId];
  const ego = robot && robot.ego;
  if (!cam || !ego) return;
  const p = painter(ctx, cameraFrame(cam));
  const gtById = Object.fromEntries(state.groundTruth.map(g => [g.id, g]));
  for (const o of ego.objects) {
    if (o.category === 'wall') continue;
    if ($('showSigma').checked && o.sigma > 0) {
      ctx.setLineDash([]); ctx.lineWidth = 2; ctx.strokeStyle = '#ffb36bdd';
      const zb = o.center[2] - o.size[2] / 2 + 0.005, r = Math.max(2 * o.sigma, 0.012), pts = [];
      for (let i = 0; i <= 36; i++) { const a = i / 36 * Math.PI * 2; pts.push([o.center[0] + r * Math.cos(a), o.center[1] + r * Math.sin(a), zb]); }
      for (let i = 0; i < 36; i++) p.line(pts[i], pts[i + 1]);
    }
    if ($('showEgoLabels').checked) {
      const conf = o.existence < 0.99 ? `  存在 ${(o.existence * 100).toFixed(0)}%` : '';
      p.text([o.center[0], o.center[1], o.center[2] + o.size[2] / 2 + 0.1], `${label(o.category, o.id)}${conf}`, '#ffd2a6');
    }
  }
  if ($('showError').checked) {
    ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.strokeStyle = '#3ecf8e';
    for (const [egoId, gtId] of Object.entries(robot.matches || {})) {
      const o = ego.objects.find(x => x.id === egoId), g = gtById[gtId];
      if (o && g && o.category !== 'wall') p.line(o.center, g.center);
    }
    ctx.setLineDash([]);
  }
}
function drawOverlays() { drawWorldOverlay(); drawEgoOverlay(); }

// ------------------------------------------------------------------ renders
function cameraQuery(cam) {
  return `lookat=${cam.lookat.join(',')}&distance=${cam.distance}&azimuth=${cam.azimuth}&elevation=${cam.elevation}`
    + `&width=${RENDER_W}&height=${RENDER_H}&t=${Date.now()}`;
}
function requestRender(name) {
  const pane = panes[name], img = $(pane.img);
  if (!view || img.dataset.busy === '1') return;
  if (name === 'ego' && !(state && robotId && state.robots[robotId] && state.robots[robotId].ego)) return;
  img.dataset.busy = '1';
  const cam = { ...view };
  const url = name === 'world'
    ? `/wca/render?camera=free&${cameraQuery(cam)}`
    : `/console/ego-render?robot=${encodeURIComponent(robotId)}&${cameraQuery(cam)}`;
  const next = new Image();
  next.onload = () => {
    img.src = next.src; pane.rendered = cam; img.dataset.busy = '0';
    if (name === 'ego') $('egoEmpty').style.display = 'none';
    drawOverlays();
  };
  next.onerror = () => { img.dataset.busy = '0'; };
  next.src = url;
}
function requestRenders() { requestRender('world'); requestRender('ego'); }
function setView(v) { view = v; requestRenders(); }

// -------------------------------------------------------------- mouse orbit
for (const id of ['vpWorld', 'vpEgo']) {
  const vp = $(id);
  let drag = null;
  vp.addEventListener('pointerdown', (e) => { if (!view) return; drag = { x: e.clientX, y: e.clientY, az: view.azimuth, el: view.elevation };
    vp.setPointerCapture(e.pointerId); vp.classList.add('dragging'); });
  vp.addEventListener('pointermove', (e) => {
    if (!drag) return;
    view = { ...view, azimuth: drag.az - (e.clientX - drag.x) * 0.35,
      elevation: Math.max(-89, Math.min(-8, drag.el - (e.clientY - drag.y) * 0.3)) };
    panes.world.rendered = view; panes.ego.rendered = view; drawOverlays(); requestRenders();
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('on'));
  });
  const end = () => { if (drag) { drag = null; vp.classList.remove('dragging'); requestRenders(); } };
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);
  vp.addEventListener('wheel', (e) => { if (!view) return; e.preventDefault();
    view = { ...view, distance: Math.max(1, Math.min(40, view.distance * (e.deltaY > 0 ? 1.1 : 1 / 1.1))) };
    requestRenders(); }, { passive: false });
}
document.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => {
  if (!state || !state.loaded) return;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b === btn));
  setView(presetView(btn.dataset.view));
});

// ------------------------------------------------------------------ refresh
async function refresh() {
  try {
    state = await api('GET', '/console/state');
    showError(null);
    if (!state.loaded) { $('clock').textContent = '未加载 Episode'; return; }
    robotId = robotId && state.robots[robotId] ? robotId : Object.keys(state.robots)[0];
    const key = `${state.scenario}|${state.view.lookat}|${state.view.distance}`;
    if (key !== viewKey) { viewKey = key; view = presetView('south'); panes.world.rendered = panes.ego.rendered = null;
      requestRenders(); document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === 'south')); }
    $('clock').textContent = `t = ${state.t.toFixed(1)} s`;
    $('task').textContent = state.task ? `任务：${state.task}` : '';
    $('pause').textContent = state.paused ? '继续' : '暂停';
    if (document.activeElement !== $('speed')) $('speed').value = String(state.speed);
    const ego = state.robots[robotId] && state.robots[robotId].ego;
    $('egoSub').textContent = ego ? `${robotId} 的自我态 · ES 版本 ${ego.version}` : '机器人自我态';
    if (!ego) $('egoEmpty').style.display = 'grid';
    drawOverlays(); drawMap(); drawMetrics(); drawEvents();
  } catch (e) { showError(e); }
}

// ------------------------------------------------------------------ top map
function drawMap() {
  const cv = $('map'), ctx = cv.getContext('2d');
  const floor = state.groundTruth.find(g => g.category === 'floor');
  const b = floor ? { cx: floor.center[0], cy: floor.center[1], w: floor.size[0] + 0.6, h: floor.size[1] + 0.6 } : { cx: 0, cy: 0, w: 8, h: 6 };
  const wantH = Math.round(cv.width * b.h / b.w); if (cv.height !== wantH) cv.height = wantH;
  const scale = Math.min(cv.width / b.w, cv.height / b.h);
  const toPx = (x, y) => [cv.width / 2 + (x - b.cx) * scale, cv.height / 2 - (y - b.cy) * scale];
  ctx.clearRect(0, 0, cv.width, cv.height);
  const rect = (c, size, yaw, fill, stroke, dash) => {
    const [px, py] = toPx(c[0], c[1]);
    ctx.save(); ctx.translate(px, py); ctx.rotate(-yaw); ctx.setLineDash(dash || []);
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(-size[0] * scale / 2, -size[1] * scale / 2, size[0] * scale, size[1] * scale); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(-size[0] * scale / 2, -size[1] * scale / 2, size[0] * scale, size[1] * scale); }
    ctx.restore();
  };
  for (const g of state.groundTruth) {
    if (g.category === 'floor') { rect(g.center, g.size, g.yaw, COLORS.floor); continue; }
    rect(g.center, g.size, g.yaw, (COLORS[g.category] || '#8fa3b8') + (g.role === 'environment' ? 'ff' : 'b0'), g.role === 'robot' ? '#9cd0ff' : null);
  }
  const ego = robotId && state.robots[robotId] && state.robots[robotId].ego;
  if (ego) {
    for (const o of ego.objects) if (o.category !== 'wall') rect(o.center, o.size, o.yaw, null, '#ff9f43', [5, 4]);
    if (ego.self) {
      const [px, py] = toPx(ego.self.x, ego.self.y);
      ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(ego.self.yaw) * 22, py - Math.sin(ego.self.yaw) * 22); ctx.stroke();
    }
  }
  if (panes.world.rendered) {
    const fr = cameraFrame(panes.world.rendered), [px, py] = toPx(fr.pos[0], fr.pos[1]);
    ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  }
}

// ------------------------------------------------------------------ metrics
function drawMetrics() {
  const robot = robotId && state.robots[robotId];
  const m = (robot && robot.metrics) || {};
  const holding = state.holding[robotId] || {};
  const pct = v => v == null ? '–' : (v * 100).toFixed(0) + '%';
  const cm = v => v == null ? '–' : (v * 100).toFixed(2) + ' cm';
  const rows = [
    ['物体召回率', pct(m.recall)], ['误检数', m.falsePositives ?? '–'], ['平均位置误差', cm(m.meanPositionErrorM)],
    ['NEES（三维理论值 3）', m.meanNees3 == null ? '–' : m.meanNees3.toFixed(2)], ['类别准确率', pct(m.categoryAccuracy)],
    ['自定位误差', cm(m.selfPositionErrorM)], ['夹爪', `${holding.gripper || '–'}${holding.holding ? '，持有 ' + holding.holding : ''}`],
  ];
  $('metrics').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const cv = $('chart'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#8b96a3'; ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('平均位置误差（cm）随仿真时间', 8, 16);
  const hist = (robot && robot.errorHistory) || [];
  if (hist.length < 2) return;
  const t0 = hist[0][0], t1 = hist[hist.length - 1][0], maxE = Math.max(...hist.map(h => h[1])) * 100 || 1;
  const x = t => 40 + (t - t0) / Math.max(t1 - t0, 1e-6) * (cv.width - 50);
  const y = e => cv.height - 20 - (e * 100) / maxE * (cv.height - 45);
  ctx.strokeStyle = '#2a313a'; ctx.beginPath(); ctx.moveTo(40, y(0)); ctx.lineTo(cv.width - 10, y(0)); ctx.stroke();
  ctx.fillText(maxE.toFixed(1), 6, y(maxE / 100) + 4); ctx.fillText('0', 24, y(0) + 4);
  ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 2; ctx.beginPath();
  hist.forEach(([t, e], i) => i ? ctx.lineTo(x(t), y(e)) : ctx.moveTo(x(t), y(e)));
  ctx.stroke();
}
function drawEvents() {
  const names = { 'grasp/attach': '抓取', 'grasp/release': '放下', 'grasp/miss': '抓空', 'episode/reset': 'Episode 重置' };
  const edits = { move: '世界修改·移动', spawn: '世界修改·新增', remove: '世界修改·删除' };
  $('events').innerHTML = state.events.slice().reverse().map(e =>
    `<li>t=${e.t.toFixed(1)} s　${(e.type === 'world/edit' && edits[e.action]) || names[e.type] || e.type}${e.entity ? '　' + e.entity : ''}${e.robot ? '（' + e.robot + '）' : ''}</li>`
  ).join('') || '<li>暂无</li>';
}

// --------------------------------------------------------------------- chat
const TOOL_NAMES = { world_edit: '修改世界', world_scene: '读取世界状态', world_status: '读取运行状态',
  asset_search: '查找资产', asset_get: '读取资产', world_clock: '仿真时钟' };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let chatSig = '', chatBusy = false;
function toolSummary(m) {
  const input = m.input && typeof m.input === 'object' ? m.input : {};
  const brief = m.tool === 'world_edit'
    ? [input.action, input.entity, input.asset, input.on ? `→ ${input.on}` : '', input.x != null ? `(${input.x}, ${input.y})` : ''].filter(Boolean).join(' ')
    : '';
  const mark = m.status === 'completed' ? '<span class="ok">✓</span>' : m.status === 'error' ? '<span class="bad">✗</span>' : '<span class="run">…</span>';
  return `${mark} ${esc(TOOL_NAMES[m.tool] || m.tool)}${brief ? '　' + esc(brief) : ''}`;
}
function renderChat(chat) {
  const box = $('chatMsgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const open = new Set([...box.querySelectorAll('details[open]')].map(d => d.dataset.id));
  box.innerHTML = chat.messages.map(m => m.role === 'tool'
    ? `<details class="tool" data-id="${m.id}"${open.has(String(m.id)) ? ' open' : ''}><summary>${toolSummary(m)}</summary>`
      + `<pre>${esc(JSON.stringify(m.input, null, 1))}</pre>${m.text ? `<pre>${esc(m.text)}</pre>` : ''}</details>`
    : `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('')
    || '<div class="msg system">在下方描述要修改的物体或位置；World Harness（DSH）会读取世界状态并调用 world_edit 执行，机器人需要自己发现变化。</div>';
  if (chat.busy) box.insertAdjacentHTML('beforeend', '<div class="msg system">World Harness 正在处理…</div>');
  if (nearBottom) box.scrollTop = box.scrollHeight;
}
async function refreshChat() {
  try {
    const chat = await api('GET', '/console/chat');
    chatBusy = chat.busy;
    $('chatSend').disabled = chat.busy || !chat.available;
    $('chatStatus').textContent = !chat.available ? '不可用' : chat.busy ? '处理中' : chat.sessionId ? '会话进行中' : 'World Harness';
    $('chatStatus').title = chat.reason || chat.sessionId || '';
    const sig = JSON.stringify([chat.busy, chat.messages]);
    if (sig !== chatSig) { chatSig = sig; renderChat(chat); }
    if (!chat.available && !chat.messages.length) $('chatMsgs').innerHTML = `<div class="msg error">${esc(chat.reason)}</div>`;
  } catch (e) { showError(e); }
}
async function sendChat(text) {
  text = (text ?? $('chatInput').value).trim();
  if (!text || chatBusy) return;
  try {
    await api('POST', '/console/chat', { message: text });
    $('chatInput').value = '';
    chatBusy = true;
    refreshChat();
  } catch (e) { showError(e); }
}
$('chatSend').onclick = () => sendChat();
$('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
});
$('chatChips').querySelectorAll('button').forEach(b => b.onclick = () => { $('chatInput').value = b.textContent; $('chatInput').focus(); });
$('chatReset').onclick = async () => { try { await api('POST', '/console/chat/reset'); refreshChat(); } catch (e) { showError(e); } };

const CAMERA_FPS = 15;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function robotCameraLoop() {
  const img = $('camRobot'), frames = [], period = 1000 / CAMERA_FPS;
  let shown = null, due = performance.now();
  for (;;) {
    if (robotId && !document.hidden) {
      try {
        const res = await fetch(`/wca/render?camera=${encodeURIComponent('robot:' + robotId)}&width=480&height=360`, { cache: 'no-store' });
        if (res.ok) {
          const url = URL.createObjectURL(await res.blob());
          const next = new Image();
          next.src = url;
          await next.decode();
          img.src = url;
          if (shown) URL.revokeObjectURL(shown);
          shown = url;
          const now = performance.now();
          frames.push(now);
          while (frames.length && frames[0] < now - 2000) frames.shift();
          const fps = frames.length > 1 ? (frames.length - 1) * 1000 / (now - frames[0]) : 0;
          $('robotCamLabel').textContent = `${robotId} 头部相机 · ${fps.toFixed(1)} fps`;
        }
      } catch (e) { /* a dropped frame is retried on the next tick */ }
    }
    due = Math.max(due + period, performance.now() - period);
    await sleep(Math.max(0, due - performance.now()));
  }
}

async function loadScenarios() {
  try {
    const { scenarios } = await api('GET', '/scenarios');
    $('scenario').innerHTML = scenarios.map(s => `<option>${s}</option>`).join('');
    if (state && state.scenario) $('scenario').value = state.scenario;
  } catch (e) { showError(e); }
}
$('load').onclick = async () => { try { await api('POST', '/wca/episode', { action: 'load', scenario: $('scenario').value }); viewKey = ''; refresh(); } catch (e) { showError(e); } };
$('reset').onclick = async () => { try { await api('POST', '/wca/episode', { action: 'reset' }); refresh(); } catch (e) { showError(e); } };
$('pause').onclick = async () => { try { await api('POST', '/wca/clock', { action: state && state.paused ? 'resume' : 'pause' }); refresh(); } catch (e) { showError(e); } };
$('speed').onchange = async () => { try { await api('POST', '/wca/clock', { action: 'speed', value: Number($('speed').value) }); refresh(); } catch (e) { showError(e); } };
for (const id of ['showGtLabels', 'showEgoLabels', 'showSigma', 'showError']) $(id).onchange = drawOverlays;

refresh().then(loadScenarios);
setInterval(refresh, 500);
setInterval(requestRenders, 400);
robotCameraLoop();
refreshChat();
setInterval(refreshChat, 800);
</script>
